apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  odoo-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "title": "Odoo Production - Full Observability",
      "tags": ["odoo", "production"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "pod",
            "label": "Odoo pod",
            "type": "query",
            "datasource": {"type": "loki", "uid": "loki"},
            "query": "label_values({namespace=\"odoo\"}, pod)",
            "multi": true,
            "includeAll": true,
            "current": {"selected": true, "text": "All", "value": "$__all"}
          }
        ]
      },
      "panels": [
        {"type": "row", "title": "Cluster overview", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}, "collapsed": false, "panels": []},
        {
          "type": "stat", "title": "Odoo pods Running", "gridPos": {"h": 4, "w": 4, "x": 0, "y": 1},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(kube_pod_status_phase{namespace=\"odoo\",phase=\"Running\"})", "refId": "A"}],
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 1}, {"color": "green", "value": 2}]}}}
        },
        {
          "type": "stat", "title": "Restarts (24h)", "gridPos": {"h": 4, "w": 4, "x": 4, "y": 1},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"odoo\"}[24h]))", "refId": "A"}],
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}}}
        },
        {
          "type": "stat", "title": "Nodes Ready", "gridPos": {"h": 4, "w": 4, "x": 8, "y": 1},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A"}]
        },
        {
          "type": "stat", "title": "Errors (last hour)", "gridPos": {"h": 4, "w": 6, "x": 12, "y": 1},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum(count_over_time({namespace=\"odoo\"} |~ \"(?i)error|exception|traceback|critical\" [1h]))", "refId": "A"}],
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 10}, {"color": "red", "value": 100}]}}}
        },
        {
          "type": "stat", "title": "Log lines/min", "gridPos": {"h": 4, "w": 6, "x": 18, "y": 1},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "sum(rate({namespace=\"odoo\"} [1m])) * 60", "refId": "A"}]
        },
        {"type": "row", "title": "Node resources", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 5}, "collapsed": false, "panels": []},
        {
          "type": "timeseries", "title": "Node CPU usage %", "gridPos": {"h": 8, "w": 8, "x": 0, "y": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "100 - (avg by(node) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{node}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}
        },
        {
          "type": "timeseries", "title": "Node memory usage %", "gridPos": {"h": 8, "w": 8, "x": 8, "y": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100", "legendFormat": "{{instance}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}
        },
        {
          "type": "timeseries", "title": "Node disk usage % (root fs)", "gridPos": {"h": 8, "w": 8, "x": 16, "y": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "100 - ((node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"}) * 100)", "legendFormat": "{{instance}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}
        },
        {
          "type": "timeseries", "title": "Network in (bytes/s)", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by(instance) (rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cali.*|cni.*|docker.*\"}[5m]))", "legendFormat": "{{instance}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "Bps"}}
        },
        {
          "type": "timeseries", "title": "Network out (bytes/s)", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by(instance) (rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cali.*|cni.*|docker.*\"}[5m]))", "legendFormat": "{{instance}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "Bps"}}
        },
        {"type": "row", "title": "Odoo pod resources", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 22}, "collapsed": false, "panels": []},
        {
          "type": "timeseries", "title": "Pod CPU (per pod)", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 23},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by(pod) (rate(container_cpu_usage_seconds_total{namespace=\"odoo\",container=\"odoo\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A"}]
        },
        {
          "type": "timeseries", "title": "Pod memory (per pod)", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 23},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by(pod) (container_memory_working_set_bytes{namespace=\"odoo\",container=\"odoo\"})", "legendFormat": "{{pod}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}}
        },
        {"type": "row", "title": "Filesystem", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 31}, "collapsed": false, "panels": []},
        {
          "type": "timeseries", "title": "PVC usage % (filestore)", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "100 - ((kubelet_volume_stats_available_bytes{namespace=\"odoo\"} / kubelet_volume_stats_capacity_bytes{namespace=\"odoo\"}) * 100)", "legendFormat": "{{persistentvolumeclaim}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}
        },
        {
          "type": "timeseries", "title": "Loki PVC usage %", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "100 - ((kubelet_volume_stats_available_bytes{namespace=\"monitoring\"} / kubelet_volume_stats_capacity_bytes{namespace=\"monitoring\"}) * 100)", "legendFormat": "{{persistentvolumeclaim}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}}
        },
        {"type": "row", "title": "Logs - Odoo", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 40}, "collapsed": false, "panels": []},
        {
          "type": "logs", "title": "Odoo all pods (live, filter by $pod)", "gridPos": {"h": 14, "w": 24, "x": 0, "y": 41},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{namespace=\"odoo\", pod=~\"$pod\"}", "refId": "A"}],
          "options": {"showTime": true, "showLabels": false, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true}
        },
        {
          "type": "logs", "title": "Errors / exceptions only", "gridPos": {"h": 12, "w": 24, "x": 0, "y": 55},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{namespace=\"odoo\"} |~ \"(?i)error|exception|traceback|critical|warning\"", "refId": "A"}],
          "options": {"showTime": true, "showLabels": false, "wrapLogMessage": true, "sortOrder": "Descending"}
        },
        {
          "type": "logs", "title": "Per-pod logs (filter by pod label, not node)", "gridPos": {"h": 14, "w": 24, "x": 0, "y": 67},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{namespace=\"odoo\", pod=~\"odoo-.*\"} | line_format \"{{.pod}} | {{__line__}}\"", "refId": "A"}],
          "options": {"showTime": true, "wrapLogMessage": true, "sortOrder": "Descending"}
        },
        {"type": "row", "title": "Logs - PostgreSQL", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 81}, "collapsed": false, "panels": []},
        {
          "type": "logs", "title": "PostgreSQL logs", "gridPos": {"h": 14, "w": 24, "x": 0, "y": 82},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"expr": "{job=\"postgresql\"}", "refId": "A"}],
          "options": {"showTime": true, "wrapLogMessage": true, "sortOrder": "Descending"}
        }
      ]
    }
