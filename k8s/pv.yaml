apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-odoo-filestore
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - hard
    - timeo=600
    - retrans=2
    - noresvport
    - rsize=1048576
    - wsize=1048576
    # Do NOT pin nfsvers unless you have confirmed what your server speaks.
    # Pinning 4.1 against an NFSv3 export = "mount.nfs: Protocol not supported".
  nfs:
    server: 10.0.0.10        # <-- replace with your NFS server IP
    path: /odoo-filestore     # <-- replace with your export path
