apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
  namespace: odoo
data:
  # Non-secret Odoo config. Secrets (db creds, master password) are injected
  # at runtime by the init container in deployment.yaml — never put them here.
  odoo.conf.template: |
    [options]
    addons_path = /mnt/extra-addons/custom-addons
    data_dir = /var/lib/odoo
    proxy_mode = True

    # --- Security: do NOT expose the database manager publicly ---
    # list_db=False hides the DB list and disables the web DB manager.
    # dbfilter pins Odoo to exactly one database. Set it to your DB name.
    list_db = False
    dbfilter = ^REPLACE_WITH_DB_NAME$

    # workers=0 runs Odoo in threaded mode. Raise only if your addons are
    # safe under concurrent writes (see the project README, Lesson 4).
    workers = 0
    max_cron_threads = 1

    http_port = 8069
    gevent_port = 8072

    # Production limits — prevent OOM, runaway requests, and hung workers.
    limit_memory_soft = 2147483648
    limit_memory_hard = 2684354560
    limit_request = 8192
    limit_time_cpu = 600
    limit_time_real = 1200
    limit_time_real_cron = -1
    db_maxconn = 64

    log_level = info
    log_handler = :INFO,werkzeug:WARNING

    without_demo = all
